minimum_pre_commit_version: "4.0.0"
repos:
  - repo: local
    hooks:
      - id: cruthunas-policy
        name: Cruthunas policy
        entry: python -m cruthunas check --changed
        language: python
        additional_dependencies:
          - PyYAML==6.0.3
          - jsonschema[format]==4.26.0
        pass_filenames: false
        stages: [pre-commit, pre-push]
